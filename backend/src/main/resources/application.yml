spring:
  application:
    name: appel-offres-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appel_offres}
    username: ${SPRING_DATASOURCE_USERNAME:appel}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${APP_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_MAX_FILE_SIZE:10MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:900000}
  refresh:
    expiration-ms: ${APP_REFRESH_EXPIRATION_MS:604800000}
  cookies:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:Lax}
  upload-dir: ${APP_UPLOAD_DIR:uploads}
  analysis:
    max-pages: ${MAX_ANALYSIS_PAGES:60}
    max-file-size-bytes: ${MAX_ANALYSIS_FILE_SIZE_BYTES:10485760}
    external-ai-enabled: ${AI_EXTERNAL_ENABLED:false}
  branding:
    max-file-size-bytes: ${BRANDING_MAX_FILE_SIZE_BYTES:2097152}
  version:
    number: ${APP_VERSION:1.0.0}
    commit: ${APP_COMMIT:local}
    environment: ${APP_ENVIRONMENT:PRODUCTION}
    build-date: ${APP_BUILD_DATE:}
    frontend: ${APP_FRONTEND_VERSION:1.0.0}
  mail:
    from: ${MAIL_FROM:no-reply@ao.local}
  dev-admin:
    email: ${APP_DEV_ADMIN_EMAIL:admin@ao.local}
    password: ${APP_DEV_ADMIN_PASSWORD}
  security:
    max-failed-attempts: ${SECURITY_MAX_FAILED_ATTEMPTS:5}
    lock-minutes: ${SECURITY_LOCK_MINUTES:15}
    csp: "${SECURITY_CSP:default-src 'self'; object-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:5173; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}"
    hsts-enabled: ${SECURITY_HSTS_ENABLED:false}
  auth:
    max-failed-attempts: ${AUTH_MAX_FAILED_ATTEMPTS:${SECURITY_MAX_FAILED_ATTEMPTS:5}}
    lock-minutes: ${AUTH_LOCK_MINUTES:${SECURITY_LOCK_MINUTES:15}}
    login-rate-limit: ${AUTH_LOGIN_RATE_LIMIT:10}
    login-rate-window-seconds: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:60}
  backup:
    dir: ${BACKUP_DIR:${APP_UPLOAD_DIR:uploads}/backups}
    retention-days: ${BACKUP_RETENTION_DAYS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    root: INFO
    com.aomanagement: INFO
    org.springframework.security: WARN
  file:
    name: ${LOG_FILE:logs/appel-offres.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:30}
      total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
